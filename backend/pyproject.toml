[tool.poetry]
name = "smartsight-backend"
version = "0.1.0"
description = "SmartSight MMM Platform Backend API"
authors = ["mahmoudkoura95 <mahmoudkoura95@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.23"
psycopg2-binary = "^2.9.9"
alembic = "^1.12.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
celery = "^5.3.4"
redis = "^5.0.1"
pandas = "^2.1.3"
numpy = "^1.25.2"
pydantic = {extras = ["email"], version = "^2.5.0"}
python-dotenv = "^1.0.0"
httpx = "^0.25.2"
pydantic-settings = "^2.10.1"
lightweight-mmm = "^0.1.7"
scikit-learn = "^1.3.2"
jax = "^0.4.35"
numpyro = "^0.13.2"
scipy = "^1.11.4"
statsmodels = "^0.14.0"
plotly = "^5.17.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
